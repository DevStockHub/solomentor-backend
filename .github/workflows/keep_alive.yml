name: Render Keep-Alive Cron

on:
  schedule:
    # Runs every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SoloMentor Backend Health Endpoint
        run: |
          # Replace with your deployed Render URL or Cloudflare Worker URL
          TARGET_URL="${{ secrets.RENDER_HEALTH_URL || 'https://your-backend.onrender.com/health' }}"
          echo "Pinging $TARGET_URL at $(date)..."
          curl -sS -m 30 "$TARGET_URL" || echo "Ping attempted."

